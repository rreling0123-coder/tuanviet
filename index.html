<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Em có thương anh không?</title>
<style>
  :root{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    background:linear-gradient(135deg,#0b0416,#1a0a33,#2d0f52,#150220);
    background-size:300% 300%;
    animation:bgMove 14s ease infinite;
    font-family:'Segoe UI','Comic Sans MS',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  @keyframes bgMove{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  #particleCanvas{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    z-index:0;
    pointer-events:none;
  }
  .stage{
    position:relative;
    z-index:2;
    width:100%;
    padding:24px;
    text-align:center;
  }
  .card{
    background:rgba(30,10,50,0.55);
    backdrop-filter:blur(10px);
    border-radius:32px;
    padding:38px 24px;
    box-shadow:0 14px 40px rgba(140,60,220,0.35), 0 0 40px rgba(180,90,255,0.15) inset;
    border:2px solid rgba(200,150,255,0.35);
    max-width:460px;
    margin:0 auto;
  }
  h1{
    color:#ffd6f7;
    font-size:clamp(1.5rem,6vw,2.2rem);
    margin:0 0 28px;
    line-height:1.4;
    font-weight:800;
    text-shadow:0 0 10px rgba(255,120,220,0.8), 0 0 22px rgba(160,90,255,0.6);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  .buttons{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:999px;
    padding:15px 30px;
    font-size:1.08rem;
    font-weight:bold;
    cursor:pointer;
    color:#fff;
    letter-spacing:0.3px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  #btnYes{background:linear-gradient(135deg,#ff6fc7,#c93fd6,#8b3fe0);}
  #btnNo{background:linear-gradient(135deg,#7a5cff,#5a35c9,#3d1f8f);}
  button:hover{transform:translateY(-3px) scale(1.06);}
  button:active{transform:scale(.9);}

  .photo-gallery{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:26px;
  }
  .photo-gallery img{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:20px;
    border:3px solid rgba(255,200,250,0.85);
    box-shadow:0 8px 20px rgba(200,80,255,0.35);
    opacity:0;
    animation:popIn .6s ease forwards;
  }
  .photo-gallery img:nth-child(1){animation-delay:.1s;}
  .photo-gallery img:nth-child(2){animation-delay:.3s;}
  .photo-gallery img:nth-child(3){animation-delay:.5s;}
  @keyframes popIn{
    from{opacity:0; transform:scale(.5) rotate(-8deg);}
    to{opacity:1; transform:scale(1) rotate(0deg);}
  }

  .angry-text{
    display:none;
    color:#ff7fd6;
    font-size:clamp(1.6rem,7vw,2.4rem);
    font-weight:900;
    text-shadow:0 0 10px rgba(255,120,220,0.9), 0 0 20px rgba(160,90,255,0.7);
    animation:shakePop .6s ease;
  }
  @keyframes shakePop{
    0%{transform:scale(0.3) rotate(-8deg); opacity:0;}
    40%{transform:scale(1.15) rotate(4deg); opacity:1;}
    55%{transform:translateX(-8px) rotate(-3deg);}
    70%{transform:translateX(8px) rotate(3deg);}
    85%{transform:translateX(-4px);}
    100%{transform:translateX(0) rotate(0deg);}
  }

  /* Ảnh chảy từ trên xuống */
  .falling-photo{
    position:fixed;
    top:-15%;
    width:120px;
    height:120px;
    border-radius:20px;
    object-fit:cover;
    border:3px solid rgba(255,200,250,0.85);
    box-shadow:0 8px 22px rgba(200,80,255,0.4);
    pointer-events:none;
    z-index:1;
    animation-name:floatDown;
    animation-timing-function:linear;
    animation-iteration-count:1;
  }
  @keyframes floatDown{
    from{ transform:translateY(0) translateX(0) rotate(0deg); opacity:.95; }
    to{ transform:translateY(120vh) translateX(var(--drift,0px)) rotate(200deg); opacity:.85; }
  }

  /* Hoa & tim bay nhẹ */
  .deco{
    position:fixed;
    top:-10%;
    font-size:1.5rem;
    pointer-events:none;
    z-index:1;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:1;
  }
  @keyframes fall{
    from{transform:translateY(0) rotate(0deg); opacity:1;}
    to{transform:translateY(115vh) rotate(360deg); opacity:.9;}
  }

  @media (max-width:380px){
    .photo-gallery img{ width:100px; height:100px; }
    .falling-photo{ width:90px; height:90px; }
  }
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<div class="stage">
  <div class="card">
    <h1>EM CÓ THƯƠNG ANH KHÔNG🌷🌷</h1>
    <div class="buttons" id="buttons">
      <button id="btnYes">Có ❤️</button>
      <button id="btnNo">Không 😡</button>
    </div>
    <div id="angryText" class="angry-text">LÀM TRÒ GÌ VẬY TUẤT 😡</div>
    <div id="gallery" class="photo-gallery"></div>
  </div>
</div>

<script>
  // ---- Hiệu ứng hạt lấp lánh (particles) trên nền ----
  (function(){
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const colors = ['rgba(255,180,240,', 'rgba(200,150,255,', 'rgba(150,200,255,'];

    function makeParticles(count){
      const arr = [];
      for(let i=0;i<count;i++){
        arr.push({
          x: Math.random()*w,
          y: Math.random()*h,
          r: Math.random()*1.8 + 0.6,
          speedY: Math.random()*0.35 + 0.08,
          speedX: (Math.random()-0.5)*0.2,
          alpha: Math.random()*0.6 + 0.2,
          twinkle: Math.random()*0.02 + 0.005,
          color: colors[Math.floor(Math.random()*colors.length)]
        });
      }
      return arr;
    }
    particles = makeParticles(90);

    function tick(){
      ctx.clearRect(0,0,w,h);
      for(const p of particles){
        p.y -= p.speedY;
        p.x += p.speedX;
        p.alpha += (Math.random()-0.5)*p.twinkle*4;
        if(p.alpha < 0.15) p.alpha = 0.15;
        if(p.alpha > 0.85) p.alpha = 0.85;
        if(p.y < -5){ p.y = h + 5; p.x = Math.random()*w; }
        if(p.x < -5) p.x = w+5;
        if(p.x > w+5) p.x = -5;
        ctx.beginPath();
        ctx.fillStyle = p.color + p.alpha + ')';
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  function spawnPhoto(){
    const src = images[Math.floor(Math.random()*images.length)];
    const img = document.createElement('img');
    img.className = 'falling-photo';
    img.src = src;
    img.alt = 'ảnh kỷ niệm';
    img.style.left = (5 + Math.random()*80) + 'vw';
    img.style.setProperty('--drift', (Math.random()*160 - 80) + 'px');
    const duration = 6 + Math.random()*3;
    img.style.animationDuration = duration + 's';
    document.body.appendChild(img);
    setTimeout(()=> img.remove(), duration*1000 + 200);
  }

  function spawnDeco(){
    const el = document.createElement('div');
    el.className = 'deco';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + 'vw';
    const duration = 4 + Math.random()*3;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (1.1 + Math.random()*1.1) + 'rem';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), duration*1000 + 200);
  }

  const gallery = document.getElementById('gallery');

  btnYes.addEventListener('click', ()=>{
    if (running) return;
    running = true;
    buttons.style.display = 'none';
    photoTimer = setInterval(spawnPhoto, 900);
    decoTimer = setInterval(spawnDeco, 350);

    gallery.innerHTML = '';
    images.forEach(src=>{
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'ảnh kỷ niệm';
      gallery.appendChild(img);
    });
  });

  btnNo.addEventListener('click', ()=>{
    btnNo.style.display = 'none';
    angryText.style.display = 'block';
  });
</script>

</body>
</html>
